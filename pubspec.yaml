name: kiosk_mind
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.6"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.1
  flutter_localizations:
    sdk: flutter
  speech_to_text: 7.5.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  shared_preferences: ^2.3.5
  image_picker: ^1.2.3
  http: ^1.2.2
  csv: ^8.0.0
  pdf: ^3.13.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Used by the speech reliability tests to sit on either side of a wall-clock
  # deadline without waiting for it. Present transitively via flutter_test;
  # declared here because the tests import it directly.
  fake_async: ^1.3.3

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

  assets:
    - assets/images/onboarding/
    - voice/intent_catalog.json
    - voice/golden/catalog_fixture.json
    - assets/images/KioskMind_logo.svg
    